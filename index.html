<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estrazione Regali di Natale 2026</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="snow"></div>
    <div class="container">
        <h1>🎄 Estrazione Regali 2026 🎁</h1>
        
        <div class="actions">
            <button id="draw-btn" class="btn">Genera Estrazione 2026</button>
        </div>

        <div id="results-2026" class="results-container hidden">
            <h2>✨ Risultati 2026 ✨</h2>
            <table id="table-2026">
                <thead>
                    <tr>
                        <th>Chi fa il regalo</th>
                        <th>A chi lo fa</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- I risultati via JS appariranno qui -->
                </tbody>
            </table>
        </div>

        <h2>Storico Estrazioni (2022-2025)</h2>
        <div class="history-tables" id="history-container">
            <!-- Le tabelle storiche verranno generate qui via JS -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
